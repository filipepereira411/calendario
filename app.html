<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendário Nativo - Seleção por Intervalo</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --surface: #ffffff;
      --text: #1f2937;
      --primary: #2563eb;
      --primary-light: #dbeafe;
      --border: #e5e7eb;
      --muted: #6b7280;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
    body { background: var(--bg); color: var(--text); padding: 20px; display: flex; gap: 20px; height: 100vh; }
    
    .cal-container { flex: 1; background: var(--surface); border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); padding: 20px; display: flex; flex-direction: column; }
    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .cal-header h2 { font-size: 24px; font-weight: 700; }
    .nav-btn { background: none; border: 1px solid var(--border); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .nav-btn:hover { background: var(--bg); }
    
    .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: 600; color: var(--muted); margin-bottom: 10px; }
    .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; flex: 1; }
    
    .day { background: var(--bg); border-radius: 8px; padding: 8px; min-height: 70px; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; border: 2px solid transparent; transition: background 0.1s ease; }
    .day:hover { border-color: var(--primary); }
    .day.empty { background: transparent; cursor: default; border: none; }
    .day.today { background: #e0e7ff; color: #4338ca; font-weight: 700; border-color: #c7d2fe; }
    
    /* Destaque para os dias selecionados no intervalo */
    .day.selected { background: var(--primary); color: white; border-color: var(--primary); }
    .day.selected .dot { background: white; }
    .day.selected .day-number { font-weight: bold; }

    .day-number { font-size: 14px; }
    .event-dots { display: flex; gap: 4px; flex-wrap: wrap; }
    .dot { width: 6px; height: 6px; background: var(--primary); border-radius: 50%; }

    .sidebar { width: 320px; background: var(--surface); border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .sidebar h3 { font-size: 18px; }
    input { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; outline: none; }
    button.btn-block { width: 100%; background: var(--primary); color: white; border: none; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    button.btn-block:hover { background: #1d4ed8; }
    .event-list { flex: 1; overflow-y: auto; font-size: 14px; max-height: 250px; }
    
    .event-item { padding: 8px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .event-date-label { font-size: 11px; color: var(--muted); display: block; }
    .delete-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 2px 6px; border-radius: 4px; }
    .delete-btn:hover { color: var(--danger); background: #fee2e2; }
    
    .clear-selection { background: none; border: 1px dashed var(--muted); color: var(--muted); padding: 6px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; text-align: center; }
    .clear-selection:hover { background: var(--bg); color: var(--text); }
  </style>
</head>
<body>

  <div class="cal-container">
    <div class="cal-header">
      <button class="nav-btn" onclick="changeMonth(-1)">◀ Ant.</button>
      <h2 id="monthTitle">Outubro 2026</h2>
      <button class="nav-btn" onclick="changeMonth(1)">Próx. ▶</button>
    </div>
    <div class="weekdays">
      <div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
    </div>
    <div class="days-grid" id="daysContainer"></div>
  </div>

  <div class="sidebar">
    <h3 id="selectedDateTitle">0 dias selecionados</h3>
    <button id="clearBtn" class="clear-selection" onclick="clearSelection()" style="display: none;">Limpar seleção</button>
    
    <div class="event-list" id="eventList">Arraste o rato sobre os dias para selecionar um intervalo.</div>
    
    <hr style="border: 0; border-top: 1px solid var(--border);">
    <h4>Adicionar Evento no Intervalo</h4>
    <input type="text" id="eventTitle" placeholder="Título do evento">
    <button class="btn-block" onclick="saveEvent()">Guardar Evento</button>
  </div>

  <script>
    let currentDate = new Date();
    let selectedDates = []; 
    let events = JSON.parse(localStorage.getItem('cal_events') || '{}');

    // Variáveis de controlo para o arrastamento do rato
    let isDragging = false;
    let dragStartId = null;

    const months = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      
      document.getElementById('monthTitle').textContent = `${months[month]} ${year}`;
      
      const firstDayIndex = new Date(year, month, 1).getDay();
      const lastDay = new Date(year, month + 1, 0).getDate();
      
      const container = document.getElementById('daysContainer');
      container.innerHTML = '';

      for (let i = 0; i < firstDayIndex; i++) {
        const emptyDiv = document.createElement('div');
        emptyDiv.classList.add('day', 'empty');
        container.appendChild(emptyDiv);
      }

      const today = new Date();
      for (let day = 1; day <= lastDay; day++) {
        const dayDiv = document.createElement('div');
        dayDiv.classList.add('day');
        
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        dayDiv.dataset.date = dateStr; // Guarda a data no elemento para o rato detetar
        
        if (day === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
          dayDiv.classList.add('today');
        }

        if (selectedDates.includes(dateStr)) {
          dayDiv.classList.add('selected');
        }

        dayDiv.innerHTML = `<span class="day-number">${day}</span>`;
        
        if (events[dateStr] && events[dateStr].length > 0) {
          const dotsContainer = document.createElement('div');
          dotsContainer.classList.add('event-dots');
          events[dateStr].forEach(() => {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            dotsContainer.appendChild(dot);
          });
          dayDiv.appendChild(dotsContainer);
        }

        // --- Eventos do Rato para Arrastar e Selecionar ---
        dayDiv.onmousedown = (e) => {
          isDragging = true;
          dragStartId = dateStr;
          
          if (e.shiftKey && selectedDates.length > 0) {
            // Suporte para Shift + Clique
            selectRange(selectedDates[0], dateStr);
          } else {
            selectedDates = [dateStr];
            renderCalendar();
            updateSidebar();
          }
        };

        dayDiv.onmouseenter = () => {
          if (isDragging && dragStartId) {
            selectRange(dragStartId, dateStr);
          }
        };

        container.appendChild(dayDiv);
      }
    }

    // Cancela o arrastamento se o utilizador largar o clique em qualquer parte da página
    window.onmouseup = () => {
      isDragging = false;
    };

    // Gera a lista de todas as datas entre o início e o fim do arrastamento
    function selectRange(startStr, endStr) {
      const startDate = new Date(startStr);
      const endDate = new Date(endStr);
      
      // Garante que funciona mesmo que arrastes de trás para a frente
      const minDate = startDate < endDate ? startDate : endDate;
      const maxDate = startDate < endDate ? endDate : startDate;
      
      const range = [];
      let current = new Date(minDate);
      
      while (current <= maxDate) {
        const y = current.getFullYear();
        const m = String(current.getMonth() + 1).padStart(2, '0');
        const d = String(current.getDate()).padStart(2, '0');
        range.push(`${y}-${m}-${d}`);
        current.setDate(current.getDate() + 1);
      }
      
      selectedDates = range;
      
      // Atualiza as classes visualmente de forma rápida sem reconstruir o DOM todo
      const days = document.querySelectorAll('.day:not(.empty)');
      days.forEach(dayDiv => {
        if (selectedDates.includes(dayDiv.dataset.date)) {
          dayDiv.classList.add('selected');
        } else {
          dayDiv.classList.remove('selected');
        }
      });
      
      updateSidebar();
    }

    function changeMonth(direction) {
      currentDate.setMonth(currentDate.getMonth() + direction);
      renderCalendar();
    }

    function clearSelection() {
      selectedDates = [];
      renderCalendar();
      updateSidebar();
    }

    function updateSidebar() {
      const title = document.getElementById('selectedDateTitle');
      const clearBtn = document.getElementById('clearBtn');
      const list = document.getElementById('eventList');
      
      if (selectedDates.length === 0) {
        title.textContent = "0 dias selecionados";
        clearBtn.style.display = "none";
        list.innerHTML = 'Arraste o rato sobre os dias para selecionar um intervalo.';
        return;
      }

      title.textContent = `${selectedDates.length} dia(s) selecionado(s)`;
      clearBtn.style.display = "block";
      list.innerHTML = '';
      
      let hasEvents = false;
